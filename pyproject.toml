[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oscin"
version = "0.1.0"
description = "OSCIN — Ontology-driven Source Code Interoperability for Agentic AI Frameworks"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Dani Lippmann" },
]
dependencies = [
    "rdflib>=7.0",
    "pyyaml>=6.0",
    "nbformat>=5.0",
    "jinja2>=3.1",
    "python-dotenv>=1.2",
    "langgraph>=1.2",
    # langchain-openai, langchain-anthropic
    "autogen-agentchat>=0.7",
    # "autogen-ext[openai]", "autogen-ext[anthropic]" + tiktoken
    "crewai",
    # anthropic, openai
]

[project.optional-dependencies]
gui = [
    "streamlit>=1.32",
]

[project.scripts]
oscin = "oscin.cli:main"

[tool.setuptools.packages.find]
include = ["oscin*"]
